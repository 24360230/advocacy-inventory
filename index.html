<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Foundation — Advocacy Grant Inventory</title>
<script src="data.js"></script>
<style>
  :root {
    --blue: #1a3a5c;
    --blue-light: #2563a8;
    --gold: #c8973a;
    --green: #2d7a4f;
    --amber: #b45309;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-400: #94a3b8;
    --gray-600: #475569;
    --gray-800: #1e293b;
    --red: #b91c1c;
    --white: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--gray-50); color: var(--gray-800); font-size: 14px; }

  /* ── HEADER ── */
  header { background: var(--blue); color: var(--white); padding: 18px 28px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  header p  { font-size: 12px; color: #93c5fd; margin-top: 3px; }

  /* ── STAT CARDS ── */
  .stats { display: flex; gap: 12px; padding: 16px 28px; flex-wrap: wrap; }
  .card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px;
          padding: 14px 18px; min-width: 140px; flex: 1; }
  .card .num { font-size: 28px; font-weight: 700; line-height: 1; }
  .card .lbl { font-size: 11px; color: var(--gray-600); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .card.blue .num   { color: var(--blue-light); }
  .card.green .num  { color: var(--green); }
  .card.amber .num  { color: var(--amber); }
  .card.gray .num   { color: var(--gray-400); }
  .card.red .num    { color: var(--red); }

  /* ── CHARTS ── */
  .charts { display: flex; gap: 16px; padding: 0 28px 16px; flex-wrap: wrap; }
  .chart-box { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px;
               padding: 16px; flex: 1; min-width: 280px; }
  .chart-box h3 { font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase;
                  letter-spacing: .5px; margin-bottom: 12px; }

  /* ── FILTERS ── */
  .filters { background: var(--white); border-bottom: 1px solid var(--gray-200);
             padding: 12px 28px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input {
    border: 1px solid var(--gray-200); border-radius: 6px; padding: 6px 10px;
    font-size: 13px; background: var(--gray-50); color: var(--gray-800); height: 34px; }
  .filters input { min-width: 200px; }
  .filters label { font-size: 12px; color: var(--gray-600); }
  .filters .filter-group { display: flex; flex-direction: column; gap: 2px; }
  #resultCount { margin-left: auto; font-size: 12px; color: var(--gray-600); align-self: flex-end; padding-bottom: 4px; }
  .btn-reset { padding: 6px 14px; background: var(--gray-100); border: 1px solid var(--gray-200);
               border-radius: 6px; font-size: 12px; cursor: pointer; height: 34px; }
  .btn-reset:hover { background: var(--gray-200); }

  /* ── TABLE ── */
  .table-wrap { padding: 0 28px 28px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--white);
          border: 1px solid var(--gray-200); border-radius: 8px; overflow: hidden;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  thead th { background: var(--blue); color: var(--white); padding: 10px 12px; text-align: left;
             font-size: 12px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--gray-100); cursor: pointer; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #eff6ff; }
  tbody td { padding: 9px 12px; font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-green  { background: #dcfce7; color: #166534; }
  .badge-amber  { background: #fef3c7; color: #92400e; }
  .badge-gray   { background: #f1f5f9; color: #475569; }
  .badge-red    { background: #fee2e2; color: #991b1b; }
  .badge-blue   { background: #dbeafe; color: #1e40af; }
  .badge-purple { background: #ede9fe; color: #5b21b6; }
  .dim-chip { display: inline-block; padding: 1px 6px; margin: 1px; border-radius: 4px;
              font-size: 10px; background: #e0f2fe; color: #0369a1; }
  .type-chip { display: inline-block; padding: 1px 6px; margin: 1px; border-radius: 4px;
               font-size: 10px; background: #f0fdf4; color: #166534; }

  /* ── PAGINATION ── */
  .pagination { display: flex; gap: 6px; align-items: center; justify-content: center;
                padding: 8px 0 20px; }
  .pagination button { padding: 5px 11px; border: 1px solid var(--gray-200); border-radius: 5px;
                       background: var(--white); cursor: pointer; font-size: 13px; }
  .pagination button:hover:not(:disabled) { background: var(--gray-100); }
  .pagination button.active { background: var(--blue); color: white; border-color: var(--blue); }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .page-info { font-size: 12px; color: var(--gray-600); }

  /* ── DETAIL DRAWER ── */
  #drawer { position: fixed; top: 0; right: -540px; width: 520px; height: 100vh;
            background: var(--white); box-shadow: -4px 0 20px rgba(0,0,0,.15);
            transition: right .25s ease; z-index: 1000; display: flex; flex-direction: column; }
  #drawer.open { right: 0; }
  #drawer-header { background: var(--blue); color: var(--white); padding: 16px 20px;
                   display: flex; align-items: flex-start; gap: 12px; }
  #drawer-header h2 { font-size: 15px; font-weight: 700; flex: 1; line-height: 1.3; }
  #drawer-close { background: none; border: none; color: white; font-size: 22px; cursor: pointer;
                  line-height: 1; padding: 0; flex-shrink: 0; }
  #drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .drow { margin-bottom: 16px; }
  .drow label { font-size: 11px; font-weight: 600; color: var(--gray-600); text-transform: uppercase;
                letter-spacing: .5px; display: block; margin-bottom: 4px; }
  .drow p, .drow .val { font-size: 13px; line-height: 1.6; color: var(--gray-800); }
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 999;
             display: none; cursor: pointer; }
  #overlay.show { display: block; }

  /* ── CONFIDENCE BAR ── */
  .conf-bar { display: flex; align-items: center; gap: 6px; }
  .conf-track { height: 6px; background: var(--gray-200); border-radius: 3px; flex: 1; }
  .conf-fill { height: 6px; border-radius: 3px; }
  .cf-green  { background: var(--green); }
  .cf-amber  { background: var(--amber); }
  .cf-red    { background: var(--red); }

  .review-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
                 background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 4px;
                 font-weight: 600; margin-top: 6px; }
  .af-cat1-flag { background: #ede9fe; color: #5b21b6; }
</style>
</head>
<body>

<header>
  <h1>Tower Foundation — Advocacy Grant Inventory</h1>
  <p id="header-sub">Loading…</p>
</header>

<div class="stats" id="statsRow"></div>

<div class="charts">
  <div class="chart-box" style="max-width:420px;">
    <h3>Advocacy Grants by Year</h3>
    <canvas id="yearChart" height="160"></canvas>
  </div>
  <div class="chart-box">
    <h3>Systems Change Dimensions (High Confidence)</h3>
    <canvas id="dimChart" height="160"></canvas>
  </div>
  <div class="chart-box">
    <h3>Advocacy Types (High Confidence)</h3>
    <canvas id="typeChart" height="160"></canvas>
  </div>
</div>

<div class="filters">
  <div class="filter-group">
    <label>Status</label>
    <select id="fStatus">
      <option value="">All Records</option>
      <option value="stage3">High Confidence (Stage 3)</option>
      <option value="review">Needs Review (Stage 2)</option>
      <option value="not">Not Advocacy</option>
      <option value="sparse">Sparse / Insufficient Text</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Dimension</label>
    <select id="fDim">
      <option value="">All Dimensions</option>
      <option value="policies">Policies</option>
      <option value="practice">Practice</option>
      <option value="resource_flows">Resource Flows</option>
      <option value="relationships">Relationships</option>
      <option value="power_dynamics">Power Dynamics</option>
      <option value="mental_models">Mental Models</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Advocacy Type</label>
    <select id="fType">
      <option value="">All Types</option>
      <option value="public_education">Public Education</option>
      <option value="legislator_education">Legislator Education</option>
      <option value="administrative_advocacy">Administrative Advocacy</option>
      <option value="community_organizing">Community Organizing</option>
      <option value="convening">Convening</option>
      <option value="research">Research / Policy Brief</option>
      <option value="advocacy_capacity_building">Advocacy Capacity Building</option>
      <option value="litigation">Litigation</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Year</label>
    <select id="fYear"><option value="">All Years</option></select>
  </div>
  <div class="filter-group">
    <label>Flags</label>
    <select id="fFlag">
      <option value="">No flag filter</option>
      <option value="review">Needs Review</option>
      <option value="af1">AF Cat 1 Review</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Search</label>
    <input type="text" id="fSearch" placeholder="Grant name, org, summary…">
  </div>
  <button class="btn-reset" onclick="resetFilters()">Reset</button>
  <span id="resultCount"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Project Name</th>
        <th>Organization</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Dimensions / Types</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="pagination" id="pagination"></div>
</div>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div id="drawer-header">
    <h2 id="drawer-title"></h2>
    <button id="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const DATA = (typeof GRANT_DATA !== 'undefined') ? GRANT_DATA : null;
if (!DATA) { document.body.innerHTML = '<p style="padding:40px;color:red;">Error: data.js not loaded. Open via a local server or GitHub Pages.</p>'; }

const DIM_LABELS = {
  policies:'Policies', practice:'Practice', resource_flows:'Resource Flows',
  relationships:'Relationships', power_dynamics:'Power Dynamics', mental_models:'Mental Models'
};
const TYPE_LABELS = {
  public_education:'Public Education', legislator_education:'Legislator Education',
  administrative_advocacy:'Administrative Advocacy', community_organizing:'Community Organizing',
  convening:'Convening', research:'Research / Policy Brief',
  advocacy_capacity_building:'Advocacy Capacity Building', litigation:'Litigation'
};
const AF_LABELS = {
  invest_in_advocacy_backbone_organizations: 'Invest in Backbone Orgs',
  identify_actionable_advocacy_priorities: 'Identify Advocacy Priorities',
  invest_in_advocacy_capacity_building: 'Invest in Advocacy Capacity Building'
};

const PER_PAGE = 25;
let filtered = [];
let page = 1;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmt$(n) {
  if (n == null) return '—';
  return '$' + Math.round(n).toLocaleString();
}
function statusOf(r) {
  if (r.sparse_flag) return 'sparse';
  if (!r.is_advocacy) return 'not';
  if (r.needs_review) return 'review';
  return 'stage3';
}
function statusBadge(r) {
  const s = statusOf(r);
  if (s === 'stage3') return '<span class="badge badge-green">High Confidence</span>';
  if (s === 'review') return '<span class="badge badge-amber">Needs Review</span>';
  if (s === 'not')    return '<span class="badge badge-gray">Not Advocacy</span>';
  return '<span class="badge badge-gray">Sparse</span>';
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function initApp() {
  if (!DATA) return;

  // Stats cards
  const m = DATA.metadata;
  document.getElementById('header-sub').textContent =
    `${m.total_records_analyzed.toLocaleString()} grants analyzed · ${m.analysis_date}`;

  document.getElementById('statsRow').innerHTML = `
    <div class="card blue"><div class="num">${m.total_advocacy_records}</div><div class="lbl">Advocacy Grants</div></div>
    <div class="card green"><div class="num">${m.advocacy_high_confidence}</div><div class="lbl">High Confidence</div></div>
    <div class="card amber"><div class="num">${m.advocacy_needs_review}</div><div class="lbl">Needs Review</div></div>
    <div class="card gray"><div class="num">${m.total_not_advocacy}</div><div class="lbl">Not Advocacy</div></div>
    <div class="card red"><div class="num">${m.total_sparse_flagged}</div><div class="lbl">Sparse / Insufficient Text</div></div>
    <div class="card blue"><div class="num">${m.advocacy_percentage}%</div><div class="lbl">Advocacy Rate</div></div>
  `;

  // Year filter
  const years = [...new Set(DATA.records.map(r => r.year))].filter(y => y !== 'Unknown').sort();
  const fy = document.getElementById('fYear');
  years.forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; fy.appendChild(o); });

  // Wire filters
  ['fStatus','fDim','fType','fYear','fFlag'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => { page = 1; applyFilters(); }));
  document.getElementById('fSearch').addEventListener('input', () => { page = 1; applyFilters(); });

  // Charts
  buildYearChart();
  buildDimChart();
  buildTypeChart();

  applyFilters();
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
function buildYearChart() {
  try {
    const byYear = DATA.summary_by_year || {};
    const labels = Object.keys(byYear).filter(y => y !== 'Unknown').sort();
    const vals   = labels.map(y => byYear[y] || 0);
    new Chart(document.getElementById('yearChart'), {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Advocacy Grants', data: vals,
        backgroundColor: '#2563a8', borderRadius: 4 }] },
      options: { plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  } catch(e) { console.warn('Year chart error', e); }
}

function buildDimChart() {
  try {
    const dims = DATA.summary_by_dimension || {};
    const labels = Object.keys(dims).map(k => DIM_LABELS[k] || k);
    const vals   = Object.values(dims).map(v => v.count);
    new Chart(document.getElementById('dimChart'), {
      type: 'bar',
      data: { labels, datasets: [{ data: vals,
        backgroundColor: ['#1a3a5c','#2563a8','#c8973a','#2d7a4f','#7c3aed','#b45309'],
        borderRadius: 4 }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  } catch(e) { console.warn('Dim chart error', e); }
}

function buildTypeChart() {
  try {
    const types = DATA.summary_by_advocacy_type || {};
    const labels = Object.keys(types).map(k => TYPE_LABELS[k] || k);
    const vals   = Object.values(types).map(v => v.count);
    new Chart(document.getElementById('typeChart'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: vals,
        backgroundColor: ['#1a3a5c','#2563a8','#c8973a','#2d7a4f','#7c3aed','#b45309','#0891b2','#b91c1c'] }] },
      options: { plugins: { legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12 } } } }
    });
  } catch(e) { console.warn('Type chart error', e); }
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
function applyFilters() {
  const fStatus = document.getElementById('fStatus').value;
  const fDim    = document.getElementById('fDim').value;
  const fType   = document.getElementById('fType').value;
  const fYear   = document.getElementById('fYear').value;
  const fFlag   = document.getElementById('fFlag').value;
  const fSearch = document.getElementById('fSearch').value.toLowerCase();

  filtered = DATA.records.filter(r => {
    const s = statusOf(r);
    if (fStatus && s !== fStatus) return false;
    if (fDim  && !(r.systems_change_dimensions || []).includes(fDim)) return false;
    if (fType && !(r.advocacy_types || []).includes(fType)) return false;
    if (fYear && r.year !== fYear) return false;
    if (fFlag === 'review' && !r.needs_review) return false;
    if (fFlag === 'af1' && !r.af_cat1_needs_review) return false;
    if (fSearch) {
      const hay = ((r.project_name||'') + ' ' + (r.organization_name||'') + ' ' +
                  (r.project_summary_excerpt||'') + ' ' + (r.what_do_you_want_excerpt||'')).toLowerCase();
      if (!hay.includes(fSearch)) return false;
    }
    return true;
  });

  document.getElementById('resultCount').textContent =
    `${filtered.length} of ${DATA.records.length} grants`;
  renderTable();
}

function resetFilters() {
  ['fStatus','fDim','fType','fYear','fFlag'].forEach(id =>
    document.getElementById(id).value = '');
  document.getElementById('fSearch').value = '';
  page = 1;
  applyFilters();
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable() {
  const start = (page - 1) * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);
  const tbody = document.getElementById('tbody');

  tbody.innerHTML = slice.map((r, i) => {
    const dimChips = (r.systems_change_dimensions||[])
      .map(d => `<span class="dim-chip">${DIM_LABELS[d]||d}</span>`).join('');
    const typeChips = (r.advocacy_types||[])
      .map(t => `<span class="type-chip">${TYPE_LABELS[t]||t}</span>`).join('');

    let reviewFlag = '';
    if (r.needs_review) reviewFlag += ' <span class="badge badge-amber" style="font-size:10px">⚑ Review</span>';
    if (r.af_cat1_needs_review) reviewFlag += ' <span class="badge badge-purple" style="font-size:10px">AF Cat 1</span>';

    return `<tr data-idx="${start + i}">
      <td>${r.year}</td>
      <td><strong>${esc(r.project_name)}</strong>${reviewFlag}</td>
      <td>${esc(r.organization_name)}</td>
      <td style="white-space:nowrap">${fmt$(r.board_approved_amount)}</td>
      <td>${statusBadge(r)}</td>
      <td>${dimChips}${typeChips}</td>
    </tr>`;
  }).join('');

  // Attach click listeners
  tbody.querySelectorAll('tr[data-idx]').forEach(tr => {
    tr.addEventListener('click', () => {
      const idx = parseInt(tr.dataset.idx);
      showDetail(filtered[idx]);
    });
  });

  renderPagination();
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── PAGINATION ────────────────────────────────────────────────────────────────
function renderPagination() {
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  let html = `<button onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹ Prev</button>`;
  const start = Math.max(1, page - 2);
  const end   = Math.min(totalPages, page + 2);
  if (start > 1) html += `<button onclick="goPage(1)">1</button>${start > 2 ? '<span>…</span>' : ''}`;
  for (let p2 = start; p2 <= end; p2++)
    html += `<button class="${p2===page?'active':''}" onclick="goPage(${p2})">${p2}</button>`;
  if (end < totalPages) html += `${end < totalPages-1 ? '<span>…</span>' : ''}<button onclick="goPage(${totalPages})">${totalPages}</button>`;
  html += `<button onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}>Next ›</button>`;
  html += `<span class="page-info">&nbsp;Page ${page} of ${totalPages}</span>`;
  el.innerHTML = html;
}

function goPage(p2) {
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  if (p2 < 1 || p2 > totalPages) return;
  page = p2;
  renderTable();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── DETAIL DRAWER ─────────────────────────────────────────────────────────────
function showDetail(r) {
  document.getElementById('drawer-title').textContent = r.project_name || '(No name)';

  const confPct = r.confidence_score != null ? Math.round(r.confidence_score * 100) : null;
  const confColor = confPct == null ? '' : confPct >= 80 ? 'cf-green' : confPct >= 50 ? 'cf-amber' : 'cf-red';

  const confHtml = confPct != null ? `
    <div class="conf-bar">
      <div class="conf-track"><div class="conf-fill ${confColor}" style="width:${confPct}%"></div></div>
      <span style="font-size:12px;font-weight:600;color:var(--gray-600)">${confPct}%</span>
    </div>` : '<span style="font-size:12px;color:var(--gray-400)">N/A (sparse)</span>';

  const dimChips = (r.systems_change_dimensions||[]).map(d =>
    `<span class="dim-chip" style="font-size:12px;padding:3px 8px">${DIM_LABELS[d]||d}</span>`).join('');

  const typeChips = (r.advocacy_types||[]).map(t =>
    `<span class="type-chip" style="font-size:12px;padding:3px 8px">${TYPE_LABELS[t]||t}</span>`).join('');

  const afChips = (r.af_recommendation_categories||[]).map(c =>
    `<span class="badge badge-blue" style="font-size:11px">${AF_LABELS[c]||c}</span>`).join(' ');

  let flags = '';
  if (r.needs_review) flags += '<span class="review-flag">⚑ Needs Manual Review</span> ';
  if (r.af_cat1_needs_review) flags += '<span class="review-flag af-cat1-flag">⚑ AF Category 1 — Manual Review</span>';
  if (r.sparse_flag)  flags += '<span class="review-flag" style="background:#f1f5f9;color:#475569">Sparse — insufficient text</span>';

  document.getElementById('drawer-body').innerHTML = `
    <div class="drow">
      <label>Organization</label>
      <p>${esc(r.organization_name)}</p>
    </div>
    <div class="drow" style="display:flex;gap:20px">
      <div><label>Year</label><p>${r.year}</p></div>
      <div><label>Amount</label><p>${fmt$(r.board_approved_amount)}</p></div>
      <div><label>Grant Name</label><p style="font-size:12px">${esc(r.grant_name)||'—'}</p></div>
    </div>
    <div class="drow">
      <label>Advocacy Status</label>
      <div style="display:flex;gap:8px;align-items:center">${statusBadge(r)}</div>
      ${flags ? `<div style="margin-top:6px">${flags}</div>` : ''}
    </div>
    ${confPct != null ? `<div class="drow"><label>Confidence Score</label>${confHtml}</div>` : ''}
    ${dimChips ? `<div class="drow"><label>Systems Change Dimensions</label><div class="chips-wrap">${dimChips}</div></div>` : ''}
    ${typeChips ? `<div class="drow"><label>Advocacy Types</label><div class="chips-wrap">${typeChips}</div></div>` : ''}
    ${afChips ? `<div class="drow"><label>AF Recommendation Categories</label><div class="chips-wrap">${afChips}</div></div>` : ''}
    <div class="drow">
      <label>Classifier Rationale</label>
      <p style="font-size:12px;color:var(--gray-600);font-style:italic">${esc(r.rationale)}</p>
    </div>
    ${r.project_summary_excerpt ? `<div class="drow"><label>Project Summary</label><p>${esc(r.project_summary_excerpt)}</p></div>` : ''}
    ${r.what_do_you_want_excerpt ? `<div class="drow"><label>What do you want to do?</label><p>${esc(r.what_do_you_want_excerpt)}</p></div>` : ''}
  `;

  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ── START ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
